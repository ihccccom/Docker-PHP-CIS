# =======================================================
# GitHub Actions 工作流：构建并发布 PHP-FPM Docker 镜像
# 构建安全加固的 PHP-FPM 镜像并推送到 Docker Hub
# （独立仓库版：Dockerfile 位于仓库根目录）
# =======================================================
#
# 本文件在仓库中的位置：.github/workflows/docker-build-push-php.yml
#
# 触发条件：
#   - 推送到 main 分支（仅修改文档类文件时不触发）
#   - 创建版本标签（v*.*.*）
#   - 手动触发（workflow_dispatch）
#
# 发布地址：
#   <DOCKERHUB_USERNAME>/php-fpm:latest
#   <DOCKERHUB_USERNAME>/php-fpm:php-<版本号>
#

name: Build and Push PHP-FPM Docker Image

on:
  push:
    branches: [ main ]
    # 独立仓库中整个仓库都是镜像源码，所以不再用 paths 白名单，
    # 改用 paths-ignore：只有"仅改了文档"的提交才跳过构建。
    # （标签推送不受 paths / paths-ignore 影响）
    paths-ignore:
      - '**.md'
      - 'LICENSE'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP 版本号 (留空使用 Dockerfile 默认值)'
        required: false
        default: ''
      use_redis:
        description: '启用 Redis 扩展'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      use_memcached:
        description: '启用 Memcached 扩展'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      use_imagick:
        description: '启用 ImageMagick 扩展'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      use_mongodb:
        description: '启用 MongoDB 扩展'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      use_swoole:
        description: '启用 Swoole 扩展'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      use_snuffleupagus:
        description: '启用 Snuffleupagus 安全扩展'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      platforms:
        description: '构建平台（多架构）'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: choice
        options:
          - 'linux/amd64'
          - 'linux/arm64'
          - 'linux/amd64,linux/arm64'

# 确保同一分支不会并发构建
concurrency:
  group: docker-build-php-${{ github.ref }}
  cancel-in-progress: true

env:
  # 镜像名称：<DOCKERHUB_USERNAME>/php-fpm
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/php-fpm

jobs:
  # ============================================================
  # AMD64 原生构建
  # ============================================================
  build-amd64:
    name: Build & Push PHP-FPM Docker Image (amd64)
    if: contains(github.event.inputs.platforms || 'linux/amd64,linux/arm64', 'amd64')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read

    steps:
      # ==========================================
      # 1. 签出代码
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ==========================================
      # 2. 从 Dockerfile 提取版本号（动态获取，避免硬编码）
      # ==========================================
      - name: Extract versions from Dockerfile
        id: versions
        run: |
          PHP_VER=$(grep -m1 '^ARG PHP_VERSION=' Dockerfile | cut -d'=' -f2)
          if [ -z "$PHP_VER" ]; then
            echo "错误：无法从 Dockerfile 提取 PHP 版本号"
            exit 1
          fi
          echo "php_version=${PHP_VER}" >> "$GITHUB_OUTPUT"
          echo "Dockerfile PHP_VERSION=${PHP_VER}"

      # ==========================================
      # 3. 设置 Docker Buildx（支持多架构构建）
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # ==========================================
      # 4. 登录 Docker Hub
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================
      # 5. 提取 Docker 元数据（标签和注释）
      # ==========================================
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # 版本标签：v1.0.0 → 1.0.0, 1.0, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # main 分支推送 → latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 包含 PHP 版本号（动态从 Dockerfile 获取）
            type=raw,value=php-${{ github.event.inputs.php_version || steps.versions.outputs.php_version }}

      # ==========================================
      # 6. 构建并推送 Docker 镜像
      # ==========================================
      - name: Build and Push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            PHP_VERSION=${{ github.event.inputs.php_version || steps.versions.outputs.php_version }}
            USE_redis=${{ github.event.inputs.use_redis || 'true' }}
            USE_memcached=${{ github.event.inputs.use_memcached || 'true' }}
            USE_imagick=${{ github.event.inputs.use_imagick || 'true' }}
            USE_mongodb=${{ github.event.inputs.use_mongodb || 'false' }}
            USE_swoole=${{ github.event.inputs.use_swoole || 'false' }}
            USE_snuffleupagus=${{ github.event.inputs.use_snuffleupagus || 'false' }}


      # ==========================================
      # 7. 上传 digest 供 merge job 使用
      # ==========================================
      - name: Upload AMD64 digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/amd64

      - name: Upload AMD64 digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-amd64
          path: /tmp/digests/amd64
          retention-days: 1

  # ============================================================
  # ARM64 原生构建（使用原生 ARM runner，彻底避免 QEMU 超时）
  # ============================================================
  build-arm64:
    name: Build & Push PHP-FPM Docker Image (arm64)
    if: contains(github.event.inputs.platforms || 'linux/amd64,linux/arm64', 'arm64')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    permissions:
      contents: read

    steps:
      # ==========================================
      # 1. 签出代码
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ==========================================
      # 2. 从 Dockerfile 提取版本号（动态获取，避免硬编码）
      # ==========================================
      - name: Extract versions from Dockerfile
        id: versions
        run: |
          PHP_VER=$(grep -m1 '^ARG PHP_VERSION=' Dockerfile | cut -d'=' -f2)
          if [ -z "$PHP_VER" ]; then
            echo "错误：无法从 Dockerfile 提取 PHP 版本号"
            exit 1
          fi
          echo "php_version=${PHP_VER}" >> "$GITHUB_OUTPUT"
          echo "Dockerfile PHP_VERSION=${PHP_VER}"

      # ==========================================
      # 3. 设置 Docker Buildx（支持多架构构建）
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # ==========================================
      # 4. 登录 Docker Hub
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================
      # 5. 提取 Docker 元数据（标签和注释）
      # ==========================================
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # 版本标签：v1.0.0 → 1.0.0, 1.0, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # main 分支推送 → latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 包含 PHP 版本号（动态从 Dockerfile 获取）
            type=raw,value=php-${{ github.event.inputs.php_version || steps.versions.outputs.php_version }}

      # ==========================================
      # 6. 构建并推送 Docker 镜像
      # ==========================================
      - name: Build and Push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          build-args: |
            PHP_VERSION=${{ github.event.inputs.php_version || steps.versions.outputs.php_version }}
            USE_redis=${{ github.event.inputs.use_redis || 'true' }}
            USE_memcached=${{ github.event.inputs.use_memcached || 'true' }}
            USE_imagick=${{ github.event.inputs.use_imagick || 'true' }}
            USE_mongodb=${{ github.event.inputs.use_mongodb || 'false' }}
            USE_swoole=${{ github.event.inputs.use_swoole || 'false' }}
            USE_snuffleupagus=${{ github.event.inputs.use_snuffleupagus || 'false' }}


      # ==========================================
      # 7. 上传 digest 供 merge job 使用
      # ==========================================
      - name: Upload ARM64 digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/arm64

      - name: Upload ARM64 digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-arm64
          path: /tmp/digests/arm64
          retention-days: 1

  # ============================================================
  # 合并多架构 manifest（两个平台都构建完成后执行）
  # ============================================================
  merge:
    name: Merge multi-arch manifest & Push tags
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    if: always() && !failure() && !cancelled()

    permissions:
      contents: read

    steps:
      # ==========================================
      # 1. 签出代码
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ==========================================
      # 2. 从 Dockerfile 提取版本号
      # ==========================================
      - name: Extract versions from Dockerfile
        id: versions
        run: |
          PHP_VER=$(grep -m1 '^ARG PHP_VERSION=' Dockerfile | cut -d'=' -f2)
          if [ -z "$PHP_VER" ]; then
            echo "错误：无法从 Dockerfile 提取 PHP 版本号"
            exit 1
          fi
          echo "php_version=${PHP_VER}" >> "$GITHUB_OUTPUT"
          echo "Dockerfile PHP_VERSION=${PHP_VER}"

      # ==========================================
      # 3. 下载所有平台的 digest
      # ==========================================
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      # ==========================================
      # 4. 设置 Docker Buildx
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # ==========================================
      # 5. 登录 Docker Hub
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================
      # 6. 提取 Docker 元数据（标签和注释）
      # ==========================================
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # 版本标签：v1.0.0 → 1.0.0, 1.0, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # main 分支推送 → latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 包含 PHP 版本号（动态从 Dockerfile 获取）
            type=raw,value=php-${{ github.event.inputs.php_version || steps.versions.outputs.php_version }}

      # ==========================================
      # 7. 合并多架构 manifest 并打 tag
      # ==========================================
      - name: Create and push multi-arch manifest
        run: |
          DIGEST_ARGS=""
          for f in /tmp/digests/*; do
            DIGEST=$(cat "$f")
            [ -n "$DIGEST" ] && DIGEST_ARGS="$DIGEST_ARGS ${{ env.IMAGE_NAME }}@${DIGEST}"
          done

          TAG_ARGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS="$TAG_ARGS --tag $tag"
          done <<< "${{ steps.meta.outputs.tags }}"

          docker buildx imagetools create $TAG_ARGS $DIGEST_ARGS

      # ==========================================
      # 8. 输出构建信息
      # ==========================================
      - name: Print image info
        run: |
          echo "============================================="
          echo " Docker 镜像构建完成"
          echo "============================================="
          echo ""
          echo "镜像标签:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed 's/^/  - /'
          echo ""
          echo "拉取命令:"
          echo "  docker pull ${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "运行命令:"
          echo "  docker run -d --name php-fpm ${{ env.IMAGE_NAME }}:latest"
